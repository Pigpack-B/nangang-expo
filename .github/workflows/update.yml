name: 每日自動更新南港展覽資料

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 檢出倉庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝必要套件
        run: |
          pip install requests python-dateutil beautifulsoup4

      - name: 執行爬蟲更新 events.json
        run: |
          python crawler.py

      - name: 自動提交並推送更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "每日自動更新展覽資料 [skip ci]" && git push)
