name: 自動更新南港展覽資料

on:
  schedule:
    # 每天 UTC 時間 22:00（即台灣時間早上 06:00）自動執行
    - cron: '0 22 * * *'
  # 支援手動在網頁上一鍵觸發測試
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出倉庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝爬蟲所需套件
        run: |
          pip install requests beautifulsoup4 python-dateutil

      - name: 執行爬蟲產出 events.json
        run: |
          python crawler.py

      - name: 將最新 events.json 提交存回倉庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新展覽資料 [skip ci]" && git push)
