<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>南港展覽館活動</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="南港展覽">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2693/2693507.png">

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent: #007aff;
            --border-color: #e5e5ea;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1c1c1e;
                --text-primary: #ffffff;
                --text-secondary: #8e8e93;
                --accent: #0a84ff;
                --border-color: #2c2c2e;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 30px) 16px;
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .notification-banner {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
        }

        .notification-banner button {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .month-section {
            margin-bottom: 32px;
        }

        .month-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border-color);
            transition: transform 0.1s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .card-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 36px;
        }

        .card-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .empty-msg {
            color: var(--text-secondary);
            font-size: 14px;
            padding: 8px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>南港展覽館活動</h1>
    </header>

    <div class="notification-banner" id="notifyBlock">
        <span style="font-size: 14px;">啟用每日與展前通知</span>
        <button onclick="requestNotification()">開啟</button>
    </div>

    <main id="contentContainer">
        <div style="text-align: center; color: var(--text-secondary); padding-top: 40px;">載入最新展覽中...</div>
    </main>

    <script>
        let exhibitions = [];

        async function initApp() {
            try {
                // 加上時間戳記防瀏覽器快取舊資料
                const res = await fetch(`events.json?t=${new Date().getTime()}`);
                if (res.ok) {
                    exhibitions = await res.json();
                }
            } catch (err) {
                console.error("載入展覽資料失敗:", err);
            }

            renderMonthSections();
            checkAndTriggerExhibitionAlert();
        }

        function renderMonthSections() {
            const container = document.getElementById("contentContainer");
            container.innerHTML = "";
            const today = new Date();
            
            // 產出當月與次月視圖
            for (let i = 0; i < 2; i++) {
                const targetDate = new Date(today.getFullYear(), today.getMonth() + i, 1);
                const year = targetDate.getFullYear();
                const month = targetDate.getMonth() + 1;

                const section = document.createElement("div");
                section.className = "month-section";

                const title = document.createElement("div");
                title.className = "month-title";
                title.innerText = `${month} 月展覽`;
                section.appendChild(title);

                const currentMonthExhibitions = exhibitions.filter(item => {
                    const start = new Date(item.startDate);
                    return start.getFullYear() === year && (start.getMonth() + 1) === month;
                });

                if (currentMonthExhibitions.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "empty-msg";
                    empty.innerText = "本月目前無排定展覽";
                    section.appendChild(empty);
                } else {
                    const grid = document.createElement("div");
                    grid.className = "grid";

                    currentMonthExhibitions.forEach(item => {
                        const card = document.createElement("a");
                        card.className = "card";
                        card.href = item.url;
                        card.target = "_blank";

                        const sDate = item.startDate.substring(5).replace('-', '/');
                        const eDate = item.endDate.substring(5).replace('-', '/');

                        card.innerHTML = `
                            <div class="card-icon">${item.icon || '🎪'}</div>
                            <div class="card-name">${item.name}</div>
                            <div class="card-date">${sDate} - ${eDate}</div>
                        `;
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                }

                container.appendChild(section);
            }
        }

        function checkAndTriggerExhibitionAlert() {
            if (!("Notification" in window) || Notification.permission !== "granted") return;

            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);

            const formatYMD = d => {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            };

            const todayStr = formatYMD(today);
            const tomorrowStr = formatYMD(tomorrow);

            const todayEvents = exhibitions.filter(e => todayStr >= e.startDate && todayStr <= e.endDate);
            const tomorrowEvents = exhibitions.filter(e => tomorrowStr >= e.startDate && tomorrowStr <= e.endDate);

            let messageParts = [];
            if (todayEvents.length > 0) messageParts.push(`【今日展覽】${todayEvents.map(e => e.name).join('、')}`);
            if (tomorrowEvents.length > 0) messageParts.push(`【明日預告】${tomorrowEvents.map(e => e.name).join('、')}`);

            if (messageParts.length > 0) {
                new Notification("南港展覽館提醒", {
                    body: messageParts.join("\n"),
                    icon: "https://cdn-icons-png.flaticon.com/512/2693/2693507.png"
                });
            }
        }

        function requestNotification() {
            if (!("Notification" in window)) {
                alert("此瀏覽器不支援通知功能");
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    document.getElementById("notifyBlock").style.display = "none";
                    checkAndTriggerExhibitionAlert();
                }
            });
        }

        window.onload = () => {
            if ("Notification" in window && Notification.permission === "granted") {
                document.getElementById("notifyBlock").style.display = "none";
            }
            initApp();
        };
    </script>
</body>
</html>
