<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>南港展覽館活動</title>
    
    <!-- iOS PWA 全螢幕設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="南港展覽">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2693/2693507.png">

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent: #007aff;
            --border-color: #e5e5ea;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1c1c1e;
                --text-primary: #ffffff;
                --text-secondary: #8e8e93;
                --accent: #0a84ff;
                --border-color: #2c2c2e;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 30px) 16px;
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .notification-banner {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
        }

        .notification-banner button {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .month-section {
            margin-bottom: 32px;
        }

        .month-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border-color);
            transition: transform 0.1s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .card-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 36px;
        }

        .card-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .empty-msg {
            color: var(--text-secondary);
            font-size: 14px;
            padding: 8px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>南港展覽館活動</h1>
    </header>

    <div class="notification-banner" id="notifyBlock">
        <span style="font-size: 14px;">啟用每日展覽通知</span>
        <button onclick="requestNotification()">開啟</button>
    </div>

    <main id="contentContainer"></main>

    <script>
        // 展覽資料庫（實務上可串接 API 或定時更新此 JSON 陣列）
        const exhibitions = [
            {
                name: "台北國際半導體展 (SEMICON)",
                startDate: "2026-09-02",
                endDate: "2026-09-04",
                icon: "💡",
                url: "https://www.tainex.com.tw"
            },
            {
                name: "台北國際自動化工業大展",
                startDate: "2026-09-16",
                endDate: "2026-09-19",
                icon: "⚙️",
                url: "https://www.tainex.com.tw"
            },
            {
                name: "台灣國際電子製造展",
                startDate: "2026-10-21",
                endDate: "2026-10-23",
                icon: "🔌",
                url: "https://www.tainex.com.tw"
            },
            {
                name: "台北國際綠色產業展",
                startDate: "2026-10-28",
                endDate: "2026-10-30",
                icon: "🌱",
                url: "https://www.tainex.com.tw"
            }
        ];

        function initApp() {
            const container = document.getElementById("contentContainer");
            const today = new Date();
            
            // 產出 2 個月份的視圖（當月與次月）
            for (let i = 0; i < 2; i++) {
                const targetDate = new Date(today.getFullYear(), today.getMonth() + i, 1);
                const year = targetDate.getFullYear();
                const month = targetDate.getMonth() + 1;

                const section = document.createElement("div");
                section.className = "month-section";

                const title = document.createElement("div");
                title.className = "month-title";
                title.innerText = `${month} 月展覽`;
                section.appendChild(title);

                // 篩選屬於該月份的展覽
                const currentMonthExhibitions = exhibitions.filter(item => {
                    const start = new Date(item.startDate);
                    return start.getFullYear() === year && (start.getMonth() + 1) === month;
                });

                if (currentMonthExhibitions.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "empty-msg";
                    empty.innerText = "本月目前無排定展覽";
                    section.appendChild(empty);
                } else {
                    const grid = document.createElement("div");
                    grid.className = "grid";

                    currentMonthExhibitions.forEach(item => {
                        const card = document.createElement("a");
                        card.className = "card";
                        card.href = item.url;
                        card.target = "_blank";

                        const sDate = item.startDate.substring(5).replace('-', '/');
                        const eDate = item.endDate.substring(5).replace('-', '/');

                        card.innerHTML = `
                            <div class="card-icon">${item.icon}</div>
                            <div class="card-name">${item.name}</div>
                            <div class="card-date">${sDate} - ${eDate}</div>
                        `;
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                }

                container.appendChild(section);
            }
        }

        // 通知權限要求
        function requestNotification() {
            if (!("Notification" in window)) {
                alert("此瀏覽器不支援通知功能");
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    document.getElementById("notifyBlock").style.display = "none";
                    new Notification("南港展覽通知已啟用", {
                        body: "每天早上將為您檢查當日展覽狀態。"
                    });
                }
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
